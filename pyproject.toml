[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-cluster-model"
version = "1.0.0"
description = "A Hierarchical Clustering Model (HCM) for Real-Time Capacitated Vehicle Routing Problems with Physical Unit Loads"
authors = [{ name = "Research Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "ortools>=9.8.0",
    "tqdm>=4.66.0",
    "requests>=2.30.0",
    "joblib>=1.3.0",
    "dacite>=1.8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "hcm*", "baselines*", "policies*", "distances*", "shared*"]
